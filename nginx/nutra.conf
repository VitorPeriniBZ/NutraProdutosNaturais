# Nginx (reverse proxy) para a Nutra na VPS.
# Coloque em /etc/nginx/sites-available/nutra e crie o symlink em sites-enabled.
# Troque "seudominio.com.br" pelo seu domínio real.
# O certificado HTTPS é adicionado automaticamente pelo Certbot (ver DEPLOY-VPS.md).

server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    # Tamanho máximo de upload (deve ser >= MAX_UPLOAD_MB da API)
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
